[project]
name = "slack-agent-controller"
version = "0.1.0"
description = "Run a Claude agent (Claude Agent SDK) on your own server and drive it from Slack: approvals, streaming, terminal hand-off, tracked GPU jobs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The slack-agent-controller authors" }]
keywords = ["slack", "claude", "agent", "claude-agent-sdk", "bedrock", "remote", "gpu", "hpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "claude-agent-sdk==0.2.182",
    "slack_bolt==1.30.0",
    "slack_sdk==3.47.0",
    "aiohttp==3.14.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=1"]

[project.urls]
Documentation = "https://github.com/tianhao0804/slack-agent-controller#readme"
Issues = "https://github.com/tianhao0804/slack-agent-controller/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slack_agent_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "UP031"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
